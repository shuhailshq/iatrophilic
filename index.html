<html lang="en">

    <style>
      :root {
        color-scheme: dark;
        --bg: #060607;
        --panel: #0d0d0f;
        --panel2: #131316;
        --line: #1c1c20;
        --text: #ececee;
        --muted: #7d7d86;
        --accent: #f2f2f4;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Space Grotesk",
          "Sora",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 30px 0 70px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 6px 0 40px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: lowercase;
        font-size: 20px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        line-height: 1;
      }
      .brand-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-left: 3px;
        transform: translate3d(0, 1px, 0);
        will-change: transform;
      }
      .install-btn {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 99px;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.03em;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.2s,
          border-color 0.2s,
          color 0.2s;
      }
      .install-btn.show {
        display: inline-flex;
      }
      .install-btn:hover {
        background: var(--panel2);
        border-color: #3a3a42;
      }
      .install-btn:active {
        transform: scale(0.94);
        background: #18181c;
        border-color: #52525b;
      }
      .install-btn svg {
        width: 13px;
        height: 13px;
        opacity: 0.78;
        flex-shrink: 0;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .install-btn:hover svg {
        transform: translateY(1px);
      }
      @media all and (display-mode: standalone),
        (display-mode: minimal-ui),
        (display-mode: fullscreen) {
        .install-btn {
          display: none !important;
        }
      }
      .searchbox {
        position: relative;
        margin: 0 0 22px;
      }
      .searchrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        transition: border-color 0.2s;
      }
      .searchrow:focus-within {
        border-color: #4a4a52;
      }
      .searchrow input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font: inherit;
        font-size: 17px;
        padding: 11px 0;
        letter-spacing: 0.01em;
      }
      .searchrow input::placeholder {
        color: #55555c;
      }
      .clear {
        flex-shrink: 0;
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid transparent;
        background: var(--panel2);
        color: var(--muted);
        border-radius: 99px;
        padding: 8px 15px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0.06em;
        outline: 0;
        user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.2s,
          border-color 0.2s,
          color 0.2s;
      }
      @media (hover: hover) {
        .clear:hover {
          background: #18181c;
          color: var(--text);
        }
      }
      .clear:active {
        transform: scale(0.92);
        background: #1f1f24;
        border-color: #3a3a42;
        color: var(--text);
      }
      .clear:focus-visible {
        border-color: #4a4a52;
        color: var(--text);
      }
      .suggestions {
        display: none;
        position: absolute;
        z-index: 5;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .suggestions.show {
        display: block;
      }
      .sug {
        width: 100%;
        display: block;
        text-align: left;
        padding: 12px 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 15px;
      }
      .sug:last-child {
        border-bottom: 0;
      }
      .sug:hover,
      .sug:focus {
        background: var(--panel2);
        outline: 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin: 12px 0;
      }
      .termhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .termhead h2 {
        font-size: 28px;
        letter-spacing: -0.03em;
        margin: 0;
        overflow-wrap: anywhere;
        font-weight: 600;
      }
      .pill {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 99px;
        padding: 5px 10px;
        white-space: nowrap;
      }
      .sectionlabel {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 12px;
      }
      .meaning,
      .simple,
      .reads {
        font-size: 16px;
        margin: 0;
        white-space: pre-line;
      }
      .reads {
        font-size: 18px;
        letter-spacing: 0.01em;
      }
      .why,
      .loading {
        font-size: 14.5px;
        color: #a2a2aa;
        margin: 0;
      }
      .loading {
        animation: p 1.2s infinite alternate;
      }
      @keyframes p {
        to {
          opacity: 0.35;
        }
      }
      .parts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 9px;
      }
      .part {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .part.un {
        border-style: dashed;
        opacity: 0.75;
      }
      .part b {
        display: block;
        font-size: 16px;
        font-weight: 600;
      }
      .part span {
        display: block;
        font-size: 13px;
        color: #b8b8c0;
        margin-top: 3px;
      }
      .part small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 7px;
      }
      .related {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 99px;
        padding: 7px 13px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .chip:hover {
        border-color: #55555c;
      }
      .tag {
        padding: 8px 14px;
        font-size: 13.5px;
        outline: 0;
        user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.2s,
          border-color 0.2s;
      }
      @media (hover: hover) {
        .tag:hover {
          background: #18181c;
        }
      }
      .tag:active {
        transform: scale(0.94);
        background: #18181c;
        border-color: #52525b;
      }
      .tag:focus-visible {
        border-color: #7d7d86;
      }
      #dbg {
        margin-top: 28px;
        padding: 10px 12px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        font:
          11px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: var(--muted);
        word-break: break-all;
      }
      #dbg .bad {
        color: #ff8a8a;
      }
      #dbg .good {
        color: #9bd96b;
      }
      .pill[hidden] {
        display: none;
      }
      .more {
        margin-top: 22px;
        text-align: center;
      }
      .more a {
        display: inline-block;
        padding: 8px 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #55555c;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.2s;
      }
      .more a::after {
        content: " \2197";
        opacity: 0.7;
      }
      @media (hover: hover) {
        .more a:hover {
          color: var(--muted);
        }
      }
      .more a:active {
        color: var(--text);
      }
      .shot {
        margin: 0 0 16px;
      }
      .shot .frame {
        height: 200px;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 14px;
        background: #f1f1f3;
      }
      .shot img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 6px;
      }
      .shot figcaption {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .shot figcaption a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }
      .src {
        display: inline-block;
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 22px;
      }
      .wm {
        text-align: center;
        margin-top: auto;
        padding-top: 56px;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: #3a3a40;
      }
      .wm a {
        color: inherit;
        text-decoration: none;
      }
      @media (max-width: 560px) {
        .card {
          padding: 16px;
        }
        .termhead h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>

        const [def, sug] = await Promise.all([
          define(term, known, wikiP, medP).catch(() => null),
          noMatch ? suggestAll(term).catch(() => []) : null,
        ]);
        if (my !== token) return;
        const box = make("div");
        if (def) {
          if (def.img) box.append(figure(def.img));
          box.append(make("p", "meaning", def.text));
          const s = make("a", "src", "Source: " + def.src);
          s.href = def.url;
          s.target = "_blank";
          s.rel = "noopener noreferrer";
          box.append(s);
        } else
          box.append(
            make("p", "meaning", fallbackText(term, ui.parts, hitC, hitP)),
          );
        ui.mean.lastChild.replaceWith(box);
        ui.done = true;
        if (sug) {
          const names2 = mergeNames(sug, 6)
            .map((x) => x.k)
            .filter((k) => k !== normalise(term))
            .slice(0, 5);
          if (names2.length) cards.push(["Did you mean", chipRow(names2)]);
        }
        let last = null;
        for (const [lb, content] of cards) last = addTo(ui.slot, lb, content);
        if (last && (hitC || hitP || c.length || p.length)) {
          const s = make("a", "src", "Source: NLM Clinical Tables");
          s.href = "https://clinicaltables.nlm.nih.gov/";
          s.target = "_blank";
          s.rel = "noopener noreferrer";
          last.append(s);
        }
      }
      let token = 0;
      function selectTerm(raw) {
        const term = normalise(raw),
          my = ++token;
        input.value = term;
        sugToken++;
        clearTimeout(sugTimer);
        suggestions.classList.remove("show");
        result.replaceChildren();
        syncDot();
        if (!term) return;
        buzz(7);
        const head = make("div", "termhead"),
          pill = make("span", "pill");
        pill.hidden = true;
        head.append(make("h2", "", term), pill);
        const hc = make("section", "card");
        hc.append(head);
        result.append(hc);
        const parts = buildParts(term);
        if (parts.length) {
          const grid = make("div", "parts");
          for (const p of parts) {
            const it = make(
              "div",
              "part" + (p[2] === "unmatched" ? " un" : ""),
            );
            it.append(
              make("b", "", p[0]),
              make("span", "", p[1]),
              make("small", "", p[2]),
            );
            grid.append(it);
          }
          addCard("Word parts", grid);
          const r = reading(parts);
          if (r) addCard("Reads as", make("p", "reads", r));
        }
        const mean = addCard(
            "What it means",
            make("p", "loading", "Looking it up…"),
          ),
          slot = make("div"),
          tail = make("div", "more");
        tail.append(searchLink(term));
        result.append(slot, tail);
        const ui = { pill, mean, slot, parts, done: false };
        fill(term, my, ui).catch(() => {
          if (my !== token || ui.done) return;
          const box = make("div");
          box.append(
            make("p", "meaning", fallbackText(term, parts, null, null)),
          );
          mean.lastChild.replaceWith(box);
        });
      }
      input.addEventListener("input", () => {
        buzz(5);
        renderSuggestions();
        syncDot();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          selectTerm(input.value);
        } else if (e.key === "Escape") {
          sugToken++;
          suggestions.classList.remove("show");
        }
      });
      document.getElementById("clearBtn").addEventListener("click", () => {
        buzz(7);
        token++;
        sugToken++;
        clearTimeout(sugTimer);
        input.value = "";
        suggestions.classList.remove("show");
        showHome();
        syncDot();
        input.focus();
      });
      // ---- home screen example tags ----
      const HOME = [
        "osteoporosis",
        "tachycardia",
        "pneumonia",
        "gastroenteritis",
        "dermatitis",
        "arthralgia",
        "myocarditis",
        "hepatitis",
      ];
      function showHome() {
        const row = make("div", "related");
        for (const t of HOME) {
          const b = make("button", "chip tag", t);
          b.type = "button";
          b.addEventListener("click", () => selectTerm(t));
          row.append(b);
        }
        result.replaceChildren(row);
      }
      showHome();
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".searchbox"))
          suggestions.classList.remove("show");
      });

      const installBtn = document.getElementById("installBtn");
      let deferredPrompt = null;
      const isInstalled = () =>
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.navigator.standalone === true;
      function updateInstallUI() {
        if (isInstalled() || !deferredPrompt)
          installBtn.classList.remove("show");
        else installBtn.classList.add("show");
      }
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        if (isInstalled()) return;
        deferredPrompt = e;
        updateInstallUI();
      });
      installBtn.addEventListener("click", async () => {
        buzz([10, 28, 14]);
        if (!deferredPrompt) return;
        const promptEvent = deferredPrompt;
        deferredPrompt = null;
        updateInstallUI();
        try {
          await promptEvent.prompt();
          const choice = await promptEvent.userChoice;
          if (choice && choice.outcome === "accepted") buzz([14, 35, 20]);
        } catch (e) {}
      });
      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        updateInstallUI();
      });
      updateInstallUI();

      const brandBtn = document.getElementById("brandBtn"),
        brandDot = document.getElementById("brandDot"),
        wm = document.getElementById("watermark");
      const SCROLL_SHIFT = 20,
        TYPE_SHIFT = 16,
        MAX_LEN = 22;
      let currentX = 0,
        targetX = 0,
        rafId = null;
      const easeInOutCubic = (t) =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      function tickDot() {
        const diff = targetX - currentX;
        if (Math.abs(diff) < 0.05) {
          currentX = targetX;
          brandDot.style.transform = `translate3d(${currentX.toFixed(2)}px,1px,0)`;
          rafId = null;
          return;
        }
        currentX += diff * 0.14;
        brandDot.style.transform = `translate3d(${currentX.toFixed(2)}px,1px,0)`;
        rafId = requestAnimationFrame(tickDot);
      }
      function syncDot() {
        const maxScroll = Math.max(
          1,
          document.documentElement.scrollHeight - window.innerHeight,
        );
        const scrollProgress = Math.min(
          1,
          Math.max(0, window.scrollY / maxScroll),
        );
        const lenProgress = Math.min(
          1,
          Math.max(0, input.value.trim().length / MAX_LEN),
        );
        const combined = Math.min(
          1,
          easeInOutCubic(scrollProgress) *
            (SCROLL_SHIFT / (SCROLL_SHIFT + TYPE_SHIFT)) +
            easeInOutCubic(lenProgress) *
              (TYPE_SHIFT / (SCROLL_SHIFT + TYPE_SHIFT)),
        );
        targetX = combined * (SCROLL_SHIFT + TYPE_SHIFT);
        if (!rafId) rafId = requestAnimationFrame(tickDot);
      }
      brandBtn.addEventListener("click", () => {
        buzz(7);
        wm.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      brandBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          buzz(7);
          wm.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
      let titleTaps = [];
      brandBtn.addEventListener("click", () => {
        const now = Date.now();
        titleTaps = titleTaps.filter((t) => now - t < 3000).concat(now);
        if (titleTaps.length >= 5) {
          titleTaps = [];
          try {
            localStorage.setItem(
              "medlex-debug",
              localStorage.getItem("medlex-debug") === "1" ? "0" : "1",
            );
          } catch (e) {}
          location.reload();
        }
      });
      window.addEventListener("scroll", syncDot, { passive: true });
      window.addEventListener("resize", syncDot, { passive: true });
      syncDot();
    </script>
  </body>
</html>
