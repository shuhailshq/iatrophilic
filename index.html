    <style>
      :root {
        color-scheme: dark;
        --bg: #060607;
        --panel: #0d0d0f;
        --panel2: #131316;
        --line: #1c1c20;
        --text: #ececee;
        --muted: #7d7d86;
        --accent: #f2f2f4;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Space Grotesk",
          "Sora",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 30px 0 70px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 6px 0 40px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: lowercase;
        font-size: 20px;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        line-height: 1;
      }
      .brand-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        margin-left: 3px;
        transform: translate3d(0, 1px, 0);
        will-change: transform;
      }
      .install-btn {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 99px;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.03em;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.2s,
          border-color 0.2s,
          color 0.2s;
      }
      .install-btn.show {
        display: inline-flex;
      }
      .install-btn:hover {
        background: var(--panel2);
        border-color: #3a3a42;
      }
      .install-btn:active {
        transform: scale(0.94);
        background: #18181c;
        border-color: #52525b;
      }
      .install-btn svg {
        width: 13px;
        height: 13px;
        opacity: 0.78;
        flex-shrink: 0;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .install-btn:hover svg {
        transform: translateY(1px);
      }
      @media all and (display-mode: standalone),
        (display-mode: minimal-ui),
        (display-mode: fullscreen) {
        .install-btn {
          display: none !important;
        }
      }
      .searchbox {
        position: relative;
        margin: 0 0 22px;
      }
      .searchrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px 8px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        transition: border-color 0.2s;
      }
      .searchrow:focus-within {
        border-color: #4a4a52;
      }
      .searchrow input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        font: inherit;
        font-size: 17px;
        padding: 11px 0;
        letter-spacing: 0.01em;
      }
      .searchrow input::placeholder {
        color: #55555c;
      }
      .clear{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border:1px solid #2a2a30;border-radius:999px;background:linear-gradient(180deg,#1a1a1e 0%,#121215 100%);color:#b9b9c2;cursor:pointer;font:inherit;font-size:12px;font-weight:500;letter-spacing:.04em;white-space:nowrap;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.35);transition:color .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease,transform .16s cubic-bezier(.2,.8,.2,1)}
.clear svg{width:13px;height:13px;flex:none;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.clear::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.14),transparent 68%);opacity:0;transition:opacity .22s ease;pointer-events:none}
.clear:hover{color:#f2f2f4;border-color:#3b3b44;background:linear-gradient(180deg,#232329 0%,#17171b 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 4px 14px rgba(0,0,0,.4);transform:translateY(-1px)}
.clear:hover::after{opacity:1}
.clear:hover svg{transform:rotate(90deg)}
.clear:active{transform:scale(.94);box-shadow:inset 0 1px 3px rgba(0,0,0,.45);transition-duration:.08s}
.clear:focus-visible{outline:2px solid #6d6d78;outline-offset:2px}
@media(max-width:400px){.clear{padding:0 11px}.clear span{display:none}}
      
      .suggestions {
        display: none;
        position: absolute;
        z-index: 5;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .suggestions.show {
        display: block;
      }
      .suggestion {
        width: 100%;
        display: block;
        text-align: left;
        padding: 12px 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 15px;
      }
      .suggestion:last-child {
        border-bottom: 0;
      }
      .suggestion:hover,
      .suggestion:focus {
        background: var(--panel2);
        outline: 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin: 12px 0;
      }
      .termhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .termhead h2 {
        font-size: 28px;
        letter-spacing: -0.03em;
        margin: 0;
        overflow-wrap: anywhere;
        font-weight: 600;
      }
      .pill {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        color: var(--muted);
        border-radius: 99px;
        padding: 5px 10px;
        white-space: nowrap;
      }
      .sectionlabel {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 12px;
      }
      .meaning,
      .simple,
      .reads {
        font-size: 16px;
        margin: 0;
        white-space: pre-line;
      }
      .reads {
        font-size: 18px;
        letter-spacing: 0.01em;
      }
      .why,
      .loading {
        font-size: 14.5px;
        color: #a2a2aa;
        margin: 0;
      }
      .loading {
        animation: p 1.2s infinite alternate;
      }
      @keyframes p {
        to {
          opacity: 0.35;
        }
      }
      .parts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 9px;
      }
      .part {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .part.un {
        border-style: dashed;
        opacity: 0.75;
      }
      .part b {
        display: block;
        font-size: 16px;
        font-weight: 600;
      }
      .part span {
        display: block;
        font-size: 13px;
        color: #b8b8c0;
        margin-top: 3px;
      }
      .part small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-top: 7px;
      }
      .related {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel2);
        color: var(--text);
        border-radius: 99px;
        padding: 7px 13px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .chip:hover {
        border-color: #55555c;
      }
      .actions {
        display: flex;
        margin-top: 14px;
      }
      .action {
        display: inline-flex;
        text-decoration: none;
        border-radius: 12px;
        padding: 10px 18px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .action.primary {
        background: var(--accent);
        color: #0a0a0b;
        font-weight: 600;
      }
      .src {
        display: inline-block;
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid var(--line);
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 22px;
      }
      .wm {
        text-align: center;
        margin-top: auto;
        padding-top: 56px;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: #3a3a40;
      }
      .wm a {
        color: inherit;
        text-decoration: none;
      }
      @media (max-width: 560px) {
        .card {
          padding: 16px;
        }
        .termhead h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>

    <script>
      "use strict";
      if (
        "serviceWorker" in navigator &&
        (/^https:$/.test(location.protocol) ||

      const DB = {
        osteoma: {
          parts: [
            ["osteo-", "bone", "root"],
            ["-oma", "mass or tumour", "suffix"],
          ],
          meaning:
            "A usually benign bone-forming tumour or growth arising from bone tissue.",
          simple:
            "Think of a small extra piece of bone growing where it should not. The word describes a growth; it does not automatically mean cancer.",
          why: "The suffix -oma means a mass or tumour, but it does not by itself tell you whether a growth is benign or malignant.",
          related: ["osteoporosis", "osteomyelitis", "osteosarcoma"],
        },
        osteomyelitis: {
          parts: [
            ["osteo-", "bone", "root"],
            ["myel-", "marrow", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning:
            "Infection-associated inflammation of bone and bone marrow, most often caused by bacteria.",
          simple:
            "Germs reach bone, multiply there, and trigger inflammation. Bone is living tissue with a blood supply, so infection can affect the bone itself and its marrow.",
          why: "The name literally points to inflammation involving bone and marrow. It is different from osteoporosis, which is loss of bone density.",
          related: ["osteoma", "osteoporosis", "sepsis"],
        },
        osteoporosis: {
          parts: [
            ["osteo-", "bone", "root"],
            ["por-", "pore or passage", "root"],
            ["-osis", "condition", "suffix"],
          ],
          meaning:
            "A condition in which bone strength is reduced, commonly because bone mineral density and bone microarchitecture are diminished.",
          simple:
            "Bone becomes less dense and more fragile, like a strong sponge becoming more hole-filled. A fracture can happen with a relatively minor fall.",
          why: "Osteoporosis is not the same as osteomalacia: osteoporosis is reduced bone mass/strength, while osteomalacia is defective mineralisation of bone.",
          related: ["osteopenia", "osteomalacia", "osteoma"],
        },
        osteopenia: {
          parts: [
            ["osteo-", "bone", "root"],
            ["-penia", "low amount or deficiency", "suffix"],
          ],
          meaning:
            "Bone mineral density that is lower than the expected young-adult reference but not low enough to meet the usual densitometric threshold for osteoporosis.",
          simple:
            "It means bone density is below the expected range, but not as low as the osteoporosis range.",
          why: "It is a description of bone density, not automatically a disease or a guarantee that a fracture will occur.",
          related: ["osteoporosis", "osteomalacia"],
        },
        gastritis: {
          parts: [
            ["gastr-", "stomach", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning: "Inflammation of the stomach lining.",
          simple:
            "The protective inner lining of the stomach is irritated or inflamed. Causes include Helicobacter pylori, certain medicines, and other irritants.",
          why: "Gastritis is not simply any stomach pain. Symptoms and causes vary, and some people have no symptoms.",
          related: ["gastroenteritis", "peptic ulcer", "hepatitis"],
        },
        gastroenteritis: {
          parts: [
            ["gastro-", "stomach", "root"],
            ["enter-", "intestine", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning:
            "Inflammation of the stomach and intestines, often due to an infection.",
          simple:
            "The gut becomes irritated, commonly causing diarrhoea, vomiting, cramps, and sometimes fever. Fluid loss is an important concern.",
          why: "Unlike gastritis, which refers to the stomach lining, gastroenteritis involves the intestines too.",
          related: ["gastritis", "enteritis", "dehydration"],
        },
        tachycardia: {
          parts: [
            ["tachy-", "fast", "prefix"],
            ["cardi-", "heart", "root"],
            ["-ia", "condition", "suffix"],
          ],
          meaning:
            "A heart rate faster than the expected range. In adults at rest, it is commonly defined as more than 100 beats per minute.",
          simple:
            "The heart is beating faster than usual. Exercise, fever, pain, anxiety, dehydration, and abnormal heart rhythms can all cause it.",
          why: "Tachycardia describes the rate, not the cause. Context matters: a fast rate during exercise is different from a persistent fast rate at rest.",
          related: ["bradycardia", "arrhythmia", "cardiomegaly"],
        },
        bradycardia: {
          parts: [
            ["brady-", "slow", "prefix"],
            ["cardi-", "heart", "root"],
            ["-ia", "condition", "suffix"],
          ],
          meaning:
            "A slower-than-expected heart rate. In adults, this is commonly defined as fewer than 60 beats per minute, although it can be normal in trained people or during sleep.",
          simple:
            "The heart is beating slowly. Whether this is a problem depends on symptoms, the person's baseline, and the cause.",
          why: "A number alone does not diagnose disease. Dizziness, fainting, weakness, or low blood pressure may make slow heart rate more concerning.",
          related: ["tachycardia", "arrhythmia", "syncope"],
        },
        hepatitis: {
          parts: [
            ["hepat-", "liver", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning: "Inflammation of the liver.",
          simple:
            "The liver becomes inflamed. Causes include viruses, alcohol, some medicines, autoimmune disease, and metabolic conditions.",
          why: "The word tells you which organ is inflamed, not what caused it. Hepatitis A, B, and C are different viral infections.",
          related: ["cirrhosis", "hepatomegaly", "cholecystitis"],
        },
        nephritis: {
          parts: [
            ["nephr-", "kidney", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning:
            "Inflammation of kidney tissue; the exact type depends on which kidney structures are affected.",
          simple:
            "Part of the kidney's filtering system becomes inflamed. This can affect urine, blood pressure, and kidney function.",
          why: "Nephritis is a broad term. Glomerulonephritis specifically involves the glomeruli, the tiny filtering units.",
          related: ["glomerulonephritis", "nephrosis", "proteinuria"],
        },
        dermatitis: {
          parts: [
            ["dermat-", "skin", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning: "Inflammation of the skin.",
          simple:
            "The skin barrier is irritated or inflamed, often causing redness, itching, dryness, or a rash.",
          why: "Dermatitis describes inflammation, not one single cause. Contact, atopic, and seborrhoeic dermatitis are different patterns.",
          related: ["dermatosis", "erythema", "pruritus"],
        },
        arthritis: {
          parts: [
            ["arthr-", "joint", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning: "Inflammation of one or more joints.",
          simple:
            "A joint is inflamed, which may cause pain, swelling, warmth, and reduced movement.",
          why: "Arthritis is not the same as arthralgia. Arthritis means joint inflammation; arthralgia means joint pain, which can occur without inflammation.",
          related: ["arthralgia", "osteoarthritis", "rheumatoid arthritis"],
        },
        arthralgia: {
          parts: [
            ["arthr-", "joint", "root"],
            ["-algia", "pain", "suffix"],
          ],
          meaning:
            "Pain in a joint or joints, without the word itself specifying the cause or whether inflammation is present.",
          simple:
            "The joint hurts. The term does not tell you why it hurts or prove that the joint is inflamed.",
          why: "Compare arthritis: -itis means inflammation, while -algia means pain.",
          related: ["arthritis", "myalgia", "neuralgia"],
        },
        myalgia: {
          parts: [
            ["my-", "muscle", "root"],
            ["-algia", "pain", "suffix"],
          ],
          meaning: "Muscle pain.",
          simple:
            "A muscle or group of muscles feels sore or painful. It can happen after exertion, with infections, or for many other reasons.",
          why: "Myalgia names a symptom, not a diagnosis or a specific cause.",
          related: ["arthralgia", "myositis", "fibromyalgia"],
        },
        cardiomegaly: {
          parts: [
            ["cardio-", "heart", "root"],
            ["-megaly", "enlargement", "suffix"],
          ],
          meaning:
            "Enlargement of the heart, usually identified on imaging; it is a finding rather than a complete diagnosis.",
          simple:
            "The heart looks larger than expected. This can happen for several reasons, including long-term pressure load or heart muscle disease.",
          why: "An enlarged heart does not reveal the cause by itself. Further assessment is needed to understand heart structure and function.",
          related: ["myocarditis", "pericarditis", "hypertension"],
        },
        myocarditis: {
          parts: [
            ["myo-", "muscle", "root"],
            ["cardi-", "heart", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning: "Inflammation of the heart muscle (myocardium).",
          simple:
            "The muscle wall that pumps blood becomes inflamed. This can affect how strongly or regularly the heart beats.",
          why: "Myocarditis affects the myocardium; pericarditis affects the sac around the heart.",
          related: ["pericarditis", "endocarditis", "cardiomyopathy"],
        },
        endocarditis: {
          parts: [
            ["endo-", "inside or inner", "prefix"],
            ["cardi-", "heart", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning:
            "Inflammation of the endocardium, often involving infection of heart valves.",
          simple:
            "The inner lining of the heart, especially a valve, becomes infected or inflamed. Bacteria in the bloodstream can attach to susceptible areas.",
          why: "Infective endocarditis can damage valves and cause serious complications; it is not simply inflammation of the heart muscle.",
          related: ["myocarditis", "pericarditis", "bacteraemia"],
        },
        pericarditis: {
          parts: [
            ["peri-", "around", "prefix"],
            ["cardi-", "heart", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning:
            "Inflammation of the pericardium, the sac surrounding the heart.",
          simple:
            "The thin covering around the heart becomes inflamed. It can cause chest pain that often changes with position or breathing.",
          why: "Pericarditis involves the outer sac, myocarditis the heart muscle, and endocarditis the inner lining.",
          related: ["myocarditis", "endocarditis", "pericardial effusion"],
        },
        pneumonia: {
          parts: [
            ["pneumon-", "lung", "root"],
            ["-ia", "condition", "suffix"],
          ],
          meaning:
            "Infection of lung tissue, especially the alveoli, which may fill with inflammatory fluid or cells.",
          simple:
            "The tiny air sacs where oxygen enters the blood become infected and inflamed, making gas exchange harder.",
          why: "Pneumonia can be caused by bacteria, viruses, fungi, or aspiration; the cause affects treatment.",
          related: ["bronchitis", "pleuritis", "hypoxia"],
        },
        pneumothorax: {
          parts: [
            ["pneumo-", "air", "root"],
            ["thorax", "chest", "root"],
          ],
          meaning:
            "Air in the pleural space, which can cause partial or complete collapse of the lung on that side.",
          simple:
            "Air gets into the space between the lung and chest wall. This removes some of the pressure that normally keeps the lung expanded.",
          why: "A tension pneumothorax is a life-threatening emergency because rising pressure can impair breathing and circulation.",
          related: ["pleural effusion", "hemothorax", "atelectasis"],
        },
        bronchitis: {
          parts: [
            ["bronch-", "bronchial tube", "root"],
            ["-itis", "inflammation", "suffix"],
          ],
          meaning:
            "Inflammation of the bronchi, the larger airways leading into the lungs.",
          simple:
            "The breathing tubes become inflamed and produce more mucus, often causing a cough.",
          why: "Acute bronchitis is commonly viral. Chronic bronchitis is a clinical pattern associated with long-term airway irritation, often from smoking.",
          related: ["pneumonia", "bronchiectasis", "asthma"],
        },
        anemia: {
          parts: [
            ["an-", "without or lacking", "prefix"],
            ["-emia", "blood condition", "suffix"],
          ],
          meaning:

        head.append(
          make("h2", "", term),
          make("span", "pill", data ? "Glossary" : "Word parts"),
        );
        const hc = make("section", "card");
        hc.append(head);
        result.append(hc);
        const parts = buildParts(term);
        if (parts.length) {
          const grid = make("div", "parts");
          for (const p of parts) {
            const it = make(
              "div",
              "part" + (p[2] === "unmatched" ? " un" : ""),
            );
            it.append(
              make("b", "", p[0]),
              make("span", "", p[1]),
              make("small", "", p[2]),
            );
            grid.append(it);
          }
          addCard("Word parts", grid);
          if (!data) {
            const r = reading(parts);
            if (r) addCard("Reads as", make("p", "reads", r));
          }
        }
        if (data) {
          addCard("What it means", make("p", "meaning", data.meaning));
          addCard("In simple words", make("p", "simple", data.simple));
          addCard("Why it matters", make("p", "why", data.why));
          const rel = make("div", "related");
          for (const r of data.related) {
            const b = make("button", "chip", r);
            b.type = "button";
            b.addEventListener("click", () => selectTerm(r));
            rel.append(b);
          }
          addCard("Related", rel);
          return;
        }
        const slot = addCard(
          "What it means",
          make("p", "loading", "Looking it up…"),
        );
        lookup(term).then((r) => {
          if (my !== token) return;
          const body = slot.lastChild;
          if (r) {
            buzz(7);
            const box = make("div");
            box.append(make("p", "meaning", r.text));
            const s = make("a", "src", "Source: " + r.src);
            s.href = r.url;
            s.target = "_blank";
            s.rel = "noopener noreferrer";
            box.append(s);
            body.replaceWith(box);
          } else {
            buzz(7);
            const box = make("div");
            box.append(make("p", "why", "No explanation could be loaded."));
            const a = make("div", "actions");
            a.append(searchLink(term));
            box.append(a);
            body.replaceWith(box);
          }
        });
      }
      input.addEventListener("input", () => {
        buzz(5);
        renderSuggestions();
        syncDot();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          selectTerm(input.value);
        } else if (e.key === "Escape") suggestions.classList.remove("show");
      });
      document.getElementById("clearBtn").addEventListener("click", () => {
        buzz(7);
        token++;
        input.value = "";
        suggestions.classList.remove("show");
        result.replaceChildren();
        syncDot();
        input.focus();
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".searchbox"))
          suggestions.classList.remove("show");
      });

      const installBtn = document.getElementById("installBtn");
      let deferredPrompt = null;
      const isInstalled = () =>
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: minimal-ui)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.navigator.standalone === true;
      function updateInstallUI() {
        if (isInstalled() || !deferredPrompt)
          installBtn.classList.remove("show");
        else installBtn.classList.add("show");
      }
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        if (isInstalled()) return;
        deferredPrompt = e;
        updateInstallUI();
      });
      installBtn.addEventListener("click", async () => {
        buzz([10, 28, 14]);
        if (!deferredPrompt) return;
        const promptEvent = deferredPrompt;
        deferredPrompt = null;
        updateInstallUI();
        try {
          await promptEvent.prompt();
          const choice = await promptEvent.userChoice;
          if (choice && choice.outcome === "accepted") buzz([14, 35, 20]);
        } catch (e) {}
      });
      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        updateInstallUI();
      });
      updateInstallUI();

      const brandBtn = document.getElementById("brandBtn"),
        brandDot = document.getElementById("brandDot"),
        wm = document.getElementById("watermark");
      const SCROLL_SHIFT = 20,
        TYPE_SHIFT = 16,
        MAX_LEN = 22;
      let currentX = 0,
        targetX = 0,
        rafId = null;
      const easeInOutCubic = (t) =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      function tickDot() {
        const diff = targetX - currentX;
        if (Math.abs(diff) < 0.05) {
          currentX = targetX;
          brandDot.style.transform = `translate3d(${currentX.toFixed(2)}px,1px,0)`;
          rafId = null;
          return;
        }
        currentX += diff * 0.14;
        brandDot.style.transform = `translate3d(${currentX.toFixed(2)}px,1px,0)`;
        rafId = requestAnimationFrame(tickDot);
      }
      function syncDot() {
        const maxScroll = Math.max(
          1,
          document.documentElement.scrollHeight - window.innerHeight,
        );
        const scrollProgress = Math.min(
          1,
          Math.max(0, window.scrollY / maxScroll),
        );
        const lenProgress = Math.min(
          1,
          Math.max(0, input.value.trim().length / MAX_LEN),
        );
        const combined = Math.min(
          1,
          easeInOutCubic(scrollProgress) *
            (SCROLL_SHIFT / (SCROLL_SHIFT + TYPE_SHIFT)) +
            easeInOutCubic(lenProgress) *
              (TYPE_SHIFT / (SCROLL_SHIFT + TYPE_SHIFT)),
        );
        targetX = combined * (SCROLL_SHIFT + TYPE_SHIFT);
        if (!rafId) rafId = requestAnimationFrame(tickDot);
      }
      brandBtn.addEventListener("click", () => {
        buzz(7);
        wm.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      brandBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          buzz(7);
          wm.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
      window.addEventListener("scroll", syncDot, { passive: true });
      window.addEventListener("resize", syncDot, { passive: true });
      syncDot();
    </script>
  </body>
</html>
